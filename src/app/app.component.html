<ng-container *ngIf="settings.loaded; else appSplash">
  <app-navbar></app-navbar>
  <router-outlet></router-outlet>
</ng-container>

<ng-template #appSplash>
  <div
    class="app-splash d-flex align-items-center justify-content-center bg-light"
    style="min-height:100dvh"
  >
    <div class="text-center">
      <div
        class="spinner-border"
        style="color:#6C91C2; width:3rem; height:3rem;"
        role="status"
        aria-label="Loading"
      ></div>
      <h5 class="mt-3" style="color:#5273A8; font-weight:600;">
        Loading…
      </h5>
      <p class="text-muted small mb-0">Please wait just a moment</p>
    </div>
  </div>
</ng-template>
