<section class="page-section" id="about" style="background-color:#f1f1f1;">
  <div class="container">
    <div class="text-center">
      <h2 class="section-heading text-uppercase">About Us</h2>
      <h3 class="section-subheading">Learn about our journey and vision.</h3>
    </div>

    <ul class="timeline">
      <li *ngFor="let it of items; let i = index"
          [class.timeline-inverted]="i % 2 === 1">
        <div class="timeline-image d-flex justify-content-center align-items-center"
             [style.background-color]="colorBg(it.color)" style="color:#fff;">
          <!-- About uses icon only (no photo) -->
          <i [class]="iconClass(it.icon)" style="font-size:28px;"></i>
        </div>

        <div class="timeline-panel" [style.borderColor]="colorBg(it.color)">
          <div class="timeline-heading">
            <h4 [style.color]="colorBg('blue')">{{ it.year }}</h4>
            <h4 class="subheading" [style.color]="colorBg('red')">{{ it.title }}</h4>
          </div>
          <div class="timeline-body" *ngIf="it.body">
            <p style="color:#212529;">{{ it.body }}</p>
          </div>
        </div>
      </li>
    </ul>
  </div>
</section>
