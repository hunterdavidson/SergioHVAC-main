<section class="page-section mt-3" id="customize">
  <div class="container">

    <!-- Loading / Error -->
    <div *ngIf="loading" class="state-card">
      <div class="spinner-border" role="status" aria-label="Loading"></div>
      <span class="ms-2">Loading settings…</span>
    </div>
    <div *ngIf="!loading && error" class="state-card error">
      <i class="fa-solid fa-triangle-exclamation me-2"></i>{{ error }}
    </div>

    <ng-container *ngIf="!loading && !error">

      <!-- NAVBAR -->
      <div class="card shadow-sm mb-4 section-card">
        <div class="card-body">
          <h4 class="mb-3">Navbar</h4>

          <div class="row g-3">
            <div class="col-12 col-md-6">
              <label class="form-label">Phone Number (shows on the right)</label>
              <input class="form-control"
                     [(ngModel)]="draft.navbar!.phone"
                     name="navbarPhone"
                     placeholder="(555) 555-5555" />
              <div class="form-text">Displayed as a “Call” action in the navbar.</div>
            </div>
          </div>
        </div>
      </div>

      <!-- HOME -->
      <div class="card shadow-sm mb-4 section-card">
        <div class="card-body">
          <h4 class="mb-3">Home</h4>

          <div class="row g-3">
            <div class="col-12 col-md-6">
              <label class="form-label">Headline</label>
              <input class="form-control" [(ngModel)]="draft.home.headline" name="homeHeadline" />
            </div>
            <div class="col-12 col-md-6">
              <label class="form-label">Subhead</label>
              <input class="form-control" [(ngModel)]="draft.home.subhead" name="homeSubhead" />
            </div>
            <div class="col-12 col-md-6">
              <label class="form-label">CTA Button Text</label>
              <input class="form-control" [(ngModel)]="draft.home.ctaText" name="homeCta" />
            </div>

            <div class="col-12">
              <label class="form-label">Hero Background Image</label>
              <div class="d-flex align-items-center gap-3 flex-wrap">
                <input type="file" accept="image/*" class="form-control" (change)="onHeroSelected($event)" style="max-width: 340px;" />
                <ng-container *ngIf="draft.home.heroUrl">
                  <a class="btn btn-outline-secondary btn-sm" [href]="draft.home.heroUrl" target="_blank" rel="noopener">Open Image</a>
                  <button type="button" class="btn btn-outline-danger btn-sm" (click)="clearHero()">Remove Image</button>
                  <img [src]="draft.home.heroUrl" alt="Hero preview" style="max-height:80px;border-radius:8px;border:1px solid #e5e7eb;" />
                </ng-container>
              </div>
              <div class="form-text">Recommended wide image. Stored in Supabase Storage (bucket: <code>assets</code>).</div>
            </div>
          </div>
        </div>
      </div>

      <!-- SERVICES (restored) -->
      <div class="card shadow-sm mb-4 section-card">
        <div class="card-body">
          <h4 class="mb-3">Services</h4>

          <div class="row g-3">
            <div class="col-12 col-md-6">
              <label class="form-label">Section Heading</label>
              <input class="form-control" [(ngModel)]="draft.services.sectionHeading" name="servicesHeading" />
            </div>
            <div class="col-12 col-md-6">
              <label class="form-label">Section Subheading</label>
              <input class="form-control" [(ngModel)]="draft.services.sectionSubheading" name="servicesSubheading" />
            </div>
          </div>

          <hr class="my-3">

          <div class="row g-3">
            <!-- AC -->
            <div class="col-12 col-lg-4">
              <div class="border rounded p-3 h-100">
                <h6 class="mb-3">Air Conditioning</h6>
                <label class="form-label">Title</label>
                <input class="form-control mb-2" [(ngModel)]="draft.services.ac.title" name="svcAcTitle" placeholder="AC Installation & Repair" />
                <label class="form-label">Body</label>
                <textarea class="form-control mb-2" rows="3" [(ngModel)]="draft.services.ac.body" name="svcAcBody"></textarea>
                <label class="form-label">CTA</label>
                <input class="form-control mb-2" [(ngModel)]="draft.services.ac.cta" name="svcAcCta" placeholder="Get AC Help" />
                <div class="form-check form-switch d-flex align-items-center gap-2">
                  <input class="form-check-input" type="checkbox" id="svcAcHidden" [(ngModel)]="draft.services.ac.hidden" name="svcAcHidden" />
                  <label class="form-check-label mb-0 ms-1" for="svcAcHidden">Hidden</label>
                </div>
              </div>
            </div>

            <!-- HEATING -->
            <div class="col-12 col-lg-4">
              <div class="border rounded p-3 h-100">
                <h6 class="mb-3">Heating</h6>
                <label class="form-label">Title</label>
                <input class="form-control mb-2" [(ngModel)]="draft.services.heat.title" name="svcHeatTitle" placeholder="Heating Installation & Repair" />
                <label class="form-label">Body</label>
                <textarea class="form-control mb-2" rows="3" [(ngModel)]="draft.services.heat.body" name="svcHeatBody"></textarea>
                <label class="form-label">CTA</label>
                <input class="form-control mb-2" [(ngModel)]="draft.services.heat.cta" name="svcHeatCta" placeholder="Get Heating Help" />
                <div class="form-check form-switch d-flex align-items-center gap-2">
                  <input class="form-check-input" type="checkbox" id="svcHeatHidden" [(ngModel)]="draft.services.heat.hidden" name="svcHeatHidden" />
                  <label class="form-check-label mb-0 ms-1" for="svcHeatHidden">Hidden</label>
                </div>
              </div>
            </div>

            <!-- MAINTENANCE -->
            <div class="col-12 col-lg-4">
              <div class="border rounded p-3 h-100">
                <h6 class="mb-3">Maintenance</h6>
                <label class="form-label">Title</label>
                <input class="form-control mb-2" [(ngModel)]="draft.services.maintenance.title" name="svcMaintTitle" placeholder="Seasonal Tune-Ups" />
                <label class="form-label">Body</label>
                <textarea class="form-control mb-2" rows="3" [(ngModel)]="draft.services.maintenance.body" name="svcMaintBody"></textarea>
                <label class="form-label">CTA</label>
                <input class="form-control mb-2" [(ngModel)]="draft.services.maintenance.cta" name="svcMaintCta" placeholder="Book a Tune-Up" />
                <div class="form-check form-switch d-flex align-items-center gap-2">
                  <input class="form-check-input" type="checkbox" id="svcMaintHidden" [(ngModel)]="draft.services.maintenance.hidden" name="svcMaintHidden" />
                  <label class="form-check-label mb-0 ms-1" for="svcMaintHidden">Hidden</label>
                </div>
              </div>
            </div>
          </div>

        </div>
      </div>

      <!-- ABOUT -->
      <div class="card shadow-sm mb-4 section-card">
        <div class="card-body">
          <h4 class="mb-3">About</h4>

          <div class="row g-3">
            <div class="col-12 col-md-6">
              <label class="form-label">Heading</label>
              <input class="form-control" [(ngModel)]="draft.about.heading" name="aboutHeading" />
            </div>
            <div class="col-12 col-md-6">
              <label class="form-label">Subheading</label>
              <input class="form-control" [(ngModel)]="draft.about.subheading" name="aboutSubheading" />
            </div>
          </div>

          <hr class="my-3">

          <div class="row g-3">
            <div class="col-12 col-md-4" *ngFor="let item of draft.about.items; let i = index">
              <div class="border rounded p-3 h-100">
                <label class="form-label">Item {{ i + 1 }} Year</label>
                <input class="form-control mb-2" [(ngModel)]="item.year" [name]="'aboutYear'+i" placeholder="2022" />
                <label class="form-label">Title</label>
                <input class="form-control mb-2" [(ngModel)]="item.title" [name]="'aboutTitle'+i" />
                <label class="form-label">Body</label>
                <textarea class="form-control mb-2" rows="3" [(ngModel)]="item.body" [name]="'aboutBody'+i"></textarea>
                <label class="form-label">Accent Color</label>
                <select class="form-control" [(ngModel)]="item.color" [name]="'aboutColor'+i">
                  <option [ngValue]="undefined">Default</option>
                  <option value="blue">Blue</option>
                  <option value="red">Red</option>
                </select>
                <div class="form-check form-switch d-flex align-items-center gap-2 mt-2">
                  <input class="form-check-input" type="checkbox"
                         [id]="'aboutHidden'+i"
                         [(ngModel)]="item.hidden"
                         [name]="'aboutHidden'+i" />
                  <label class="form-check-label mb-0 ms-1" [for]="'aboutHidden'+i">Hidden</label>
                </div>
              </div>
            </div>
          </div>

        </div>
      </div>

      <!-- TEAM -->
      <div class="card shadow-sm mb-4 section-card">
        <div class="card-body">
          <h4 class="mb-3">Team</h4>

          <div class="row g-3">
            <div class="col-12 col-md-6">
              <label class="form-label">Heading</label>
              <input class="form-control" [(ngModel)]="draft.team.heading" name="teamHeading" />
            </div>
            <div class="col-12 col-md-6">
              <label class="form-label">Subheading</label>
              <input class="form-control" [(ngModel)]="draft.team.subheading" name="teamSubheading" />
            </div>
          </div>

          <hr class="my-3">

          <div class="row g-3">
            <div class="col-12 col-lg-4" *ngFor="let mem of draft.team.members; let idx = index">
              <div class="border rounded p-3 h-100">
                <h6 class="mb-3">Member {{ idx + 1 }}</h6>

                <label class="form-label">Name</label>
                <input class="form-control mb-2" [(ngModel)]="mem.name" [name]="'teamName'+idx" />

                <label class="form-label">Role</label>
                <input class="form-control mb-2" [(ngModel)]="mem.role" [name]="'teamRole'+idx" />

                <label class="form-label">Icon (Font Awesome class)</label>
                <input class="form-control mb-2" [(ngModel)]="mem.icon" [name]="'teamIcon'+idx" placeholder="fa-user" />

                <div class="form-check form-switch d-flex align-items-center gap-2 mb-2">
                  <input class="form-check-input" type="checkbox" [id]="'teamHidden'+idx" [(ngModel)]="mem.hidden" [name]="'teamHidden'+idx" />
                  <label class="form-check-label mb-0 ms-1" [for]="'teamHidden'+idx">Hidden</label>
                </div>

                <label class="form-label">Photo</label>
                <div class="d-flex align-items-center gap-3 flex-wrap mb-2">
                  <input type="file" accept="image/*" class="form-control" (change)="onTeamSelected($event, idx)" style="max-width: 320px;" />
                  <ng-container *ngIf="mem.photoUrl">
                    <a class="btn btn-outline-secondary btn-sm" [href]="mem.photoUrl" target="_blank" rel="noopener">Open</a>
                    <button type="button" class="btn btn-outline-danger btn-sm" (click)="clearTeamPhoto(idx)">Remove</button>
                    <img [src]="mem.photoUrl" alt="Team preview" style="max-height:72px;border-radius:8px;border:1px solid #e5e7eb;" />
                  </ng-container>
                </div>
              </div>
            </div>
          </div>

        </div>
      </div>

      <!-- CONTACT -->
      <div class="card shadow-sm mb-4 section-card">
        <div class="card-body">
          <h4 class="mb-3">Contact</h4>

          <div class="row g-3">
            <div class="col-12 col-md-6">
              <label class="form-label">Heading</label>
              <input class="form-control" [(ngModel)]="draft.contact.heading" name="contactHeading" />
            </div>
            <div class="col-12 col-md-6">
              <label class="form-label">Subheading</label>
              <input class="form-control" [(ngModel)]="draft.contact.subheading" name="contactSubheading" />
            </div>
            <div class="col-12 col-md-6">
              <label class="form-label">Phone Lead (text before the phone number)</label>
              <input class="form-control" [(ngModel)]="draft.contact.phoneLead" name="contactPhoneLead" />
            </div>
            <div class="col-12 col-md-6">
              <label class="form-label">Submit Button Text (CTA)</label>
              <input class="form-control" [(ngModel)]="draft.contact.cta" name="contactCta" />
            </div>
          </div>
        </div>
      </div>

      <!-- SAVE BAR (full-width, content-aligned) -->
      <div class="save-bar">
        <div class="container d-flex align-items-center justify-content-end gap-2" aria-live="polite">
          <span *ngIf="saveOk" class="badge bg-success-subtle text-success border border-success-subtle me-2">
            Saved
          </span>
          <span *ngIf="saveError" class="badge bg-danger-subtle text-danger border border-danger-subtle me-2">
            {{ saveError }}
          </span>
          <button class="btn btn-outline-secondary" (click)="save()" [disabled]="saving">
            {{ saving ? 'Saving…' : 'Save Changes' }}
          </button>
        </div>
      </div>
      <div class="save-bar-spacer"></div>

    </ng-container>
  </div>
</section>
