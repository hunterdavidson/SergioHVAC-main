<section class="page-section" style="margin-top:5rem">
  <div class="container" style="max-width:480px">
    <h2 class="mb-4 text-center">Admin Login</h2>

    <form (ngSubmit)="submit()">
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input class="form-control" type="email" [(ngModel)]="email" name="email" required />
      </div>

      <div class="mb-3">
        <label class="form-label">Password</label>
        <input class="form-control" type="password" [(ngModel)]="password" name="password" required />
      </div>

      <button class="btn btn-primary w-100" type="submit" [disabled]="loading">
        {{ loading ? 'Signing in…' : 'Sign In' }}
      </button>

      <div class="text-danger mt-3" *ngIf="error">{{ error }}</div>
    </form>
  </div>
</section>
