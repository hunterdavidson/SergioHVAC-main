<section class="page-section compact-section" id="contact">
  <div class="container">
    <div class="text-center">
      <h2 class="section-heading text-uppercase mb-2">{{ settings.contact.heading }}</h2>
      <h3 class="section-subheading text-white mb-2">{{ settings.contact.subheading }}</h3>
      <p class="mt-1 text-white">
        {{ settings.contact.phoneLead }}
        <a [href]="'tel:'+settings.navbar?.phone" class="fw-bold text-white">{{ settings.navbar?.phone }}</a>
      </p>
    </div>

    <form #contactForm="ngForm" (ngSubmit)="onSubmit(contactForm)" novalidate>
      <div class="row">
        <!-- Name -->
        <div class="col-md-6">
          <label for="name" class="visually-hidden">Name</label>
          <input type="text" id="name" name="name" class="form-control mb-4"
                 placeholder="Name *" required autocomplete="name"
                 [(ngModel)]="formData.name" #name="ngModel" />
        </div>

        <!-- Email -->
        <div class="col-md-6">
          <label for="email" class="visually-hidden">Email</label>
          <input type="email" id="email" name="email" class="form-control mb-4"
                 placeholder="Email *" required email autocomplete="email"
                 [(ngModel)]="formData.email" #email="ngModel" />
        </div>
      </div>

      <!-- Phone -->
      <div class="row">
        <div class="col-md-12">
          <label for="phone" class="visually-hidden">Phone</label>
          <input type="tel" id="phone" name="phone" class="form-control mb-4"
                 placeholder="Phone *" required pattern="^[0-9\-\+\s\(\)]{7,15}$" autocomplete="tel"
                 [(ngModel)]="formData.phone" #phone="ngModel" />
        </div>
      </div>

      <!-- Message -->
      <div class="row">
        <div class="col-md-12">
          <label for="message" class="visually-hidden">Message</label>
          <textarea id="message" name="message" class="form-control mb-2" rows="5"
                    placeholder="Message (optional)" [(ngModel)]="formData.message"
                    #message="ngModel" maxlength="4000"></textarea>
        </div>
      </div>

      <div class="text-center">
        <button
          class="btn btn-xl text-uppercase dynamic-button mt-3"
          type="submit"
          [disabled]="contactForm.invalid || loading"
          *ngIf="!isSubmitted"
        >
          {{ settings.contact.cta }}
        </button>

        <p class="text-white mt-3" *ngIf="isSubmitted">Thank you! Your request was sent. We’ll follow up shortly.</p>
        <p class="text-danger mt-3" *ngIf="error && !isSubmitted">{{ error }}</p>

        <p class="text-white-50 mt-2">
          By submitting, you agree we may contact you about your request.
        </p>
      </div>
    </form>
  </div>
</section>
