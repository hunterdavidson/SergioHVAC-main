<section class="page-section" id="admin">
  <div class="container">
    <!-- Header -->
    <div
      class="admin-header d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center"
    >
      <h2 class="text-uppercase mb-0">Leads</h2>
      <div class="admin-actions mt-3 mt-md-0">
        <button class="btn btn-outline-secondary btn-sm me-2" (click)="exportCsv()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" class="me-2" aria-hidden="true"><path d="M12 3a1 1 0 011 1v8.59l2.3-2.3a1 1 0 111.4 1.42l-4 4a1 1 0 01-1.4 0l-4-4a1 1 0 111.4-1.42L11 12.59V4a1 1 0 011-1zm-7 14a1 1 0 000 2h14a1 1 0 100-2H5z"/></svg>
          Export CSV
        </button>
        <button class="btn btn-outline-secondary btn-sm" (click)="signOut()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" class="me-2" aria-hidden="true"><path d="M10 3a1 1 0 011 1v2h2V4a3 3 0 00-3-3H7a3 3 0 00-3 3v16a3 3 0 003 3h3a3 3 0 003-3v-2h-2v2a1 1 0 01-1 1H7a1 1 0 01-1-1V4a1 1 0 011-1h3zm7.3 7.3a1 1 0 00-1.4 1.4L17.59 13H11a1 1 0 000 2h6.59l-1.7 1.7a1 1 0 001.42 1.4l3.4-3.4a1 1 0 000-1.4l-3.4-3.4z"/></svg>
          Sign Out
        </button>
      </div>
    </div>

    <!-- Settings -->
    <div class="card shadow-sm mb-4">
      <div
        class="card-body d-flex flex-column flex-md-row align-items-start align-items-md-center justify-content-between w-100"
      >
        <!-- Toggle -->
        <div class="form-check form-switch mb-3 mb-md-0 me-md-4">
          <input
            class="form-check-input"
            type="checkbox"
            id="notifySwitch"
            [(ngModel)]="notifyNewLead"
            (change)="saveSettings()"
            [disabled]="saving"
          />
          <label class="form-check-label ms-2" for="notifySwitch">
            Email me when a new lead arrives
          </label>
        </div>

        <!-- Email + Save + Status inline -->
        <div class="d-flex align-items-center flex-wrap gap-2 flex-grow-1">
          <input
            id="notifyEmail"
            class="form-control"
            type="email"
            autocomplete="email"
            placeholder="Notification email"
            [(ngModel)]="notifyEmail"
            (blur)="saveSettings()"
            (keyup.enter)="saveSettings()"
            [ngModelOptions]="{ updateOn: 'blur' }"
            aria-describedby="notifyHelp"
            style="min-width:240px; max-width:320px;"
            [disabled]="saving"
          />
          <small id="notifyHelp" class="text-muted ms-1">We'll send new lead alerts here.</small>
          <button
            class="btn btn-outline-secondary ms-2"
            type="button"
            (click)="saveSettings()"
            [disabled]="saving"
            [attr.aria-busy]="saving ? 'true' : 'false'"
          >
            {{ saving ? 'Saving…' : 'Save' }}
          </button>
          <!-- status badges -->
          <span
            *ngIf="saveOk"
            class="badge bg-success-subtle text-success border border-success-subtle ms-2"
            aria-live="polite"
            >Saved</span
          >
          <span
            *ngIf="saveError"
            class="badge bg-danger-subtle text-danger border border-danger-subtle ms-2"
            aria-live="polite"
            >{{ saveError }}</span
          >
        </div>
      </div>
    </div>

    <!-- Loading / Error / Empty -->
    <div *ngIf="loading" class="state-card">
      <div class="spinner-border" role="status" aria-label="Loading"></div>
      <span class="ms-2">Loading leads…</span>
    </div>

    <div *ngIf="!loading && error" class="state-card error">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" class="me-2" aria-hidden="true"><path d="M1 21h22L12 2 1 21zm12-3h-2v2h2v-2zm0-8h-2v6h2V10z"/></svg>
      {{ error }}
    </div>

    <div *ngIf="!loading && !error && !leads.length" class="state-card">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" class="me-2" aria-hidden="true"><path d="M19 3H4.99C3.88 3 3 3.89 3 5v14a2 2 0 002 2h14a2 2 0 002-2V5c0-1.11-.9-2-2-2zm0 12h-3.5a3.5 3.5 0 01-7 0H5V5h14v10z"/></svg>
      No leads yet.
    </div>

    <!-- Leads table -->
    <div class="card shadow-sm" *ngIf="!loading && !error && leads.length">
      <div class="table-responsive">
        <table class="table align-middle mb-0 admin-table">
          <thead>
            <tr>
              <th scope="col">Received</th>
              <th scope="col">Contact Info</th>
              <th scope="col">Message</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let lead of leads; trackBy: trackById" role="row">
              <td class="when" role="cell">
                <div class="time">{{ lead.created_at | date : 'short' }}</div>
              </td>

              <td class="contact" role="cell">
                <div class="name fw-semibold">{{ lead.name }}</div>
                <div class="info">
                  <a [href]="'mailto:'+lead.email" class="contact-link">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" class="me-1" aria-hidden="true"><path d="M20 4H4a2 2 0 00-2 2v12a2 2 0 002 2h16a2 2 0 002-2V6a2 2 0 00-2-2zm0 4l-8 5L4 8V6l8 5 8-5v2z"/></svg>
                    {{ lead.email }}
                  </a>
                  <a [href]="'tel:'+lead.phone" class="contact-link">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" class="me-1" aria-hidden="true"><path d="M6.62 10.79a15.05 15.05 0 006.59 6.59l2.2-2.2a1 1 0 011.01-.24c1.12.37 2.33.57 3.58.57a1 1 0 011 1V21a1 1 0 01-1 1C10.85 22 2 13.15 2 2a1 1 0 011-1h3.5a1 1 0 011 1c0 1.25.2 2.46.57 3.58a1 1 0 01-.24 1.01l-2.2 2.2z"/></svg>
                    {{ lead.phone }}
                  </a>
                </div>
              </td>

              <td class="message" role="cell">
                <span *ngIf="lead.message; else noMsg">{{ lead.message }}</span>
                <ng-template #noMsg><span class="text-muted">—</span></ng-template>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Pagination -->
    <nav *ngIf="!loading && !error && totalPages > 1" aria-label="Leads pagination" class="mt-3 d-flex justify-content-center">
      <ul class="pagination hvac-pagination mb-0">
        <li class="page-item" [class.disabled]="page === 1">
          <button class="page-link" type="button" (click)="prevPage()" aria-label="Previous">«</button>
        </li>

        <li class="page-item" *ngFor="let p of pages" [class.active]="p === page">
          <button class="page-link" type="button" (click)="changePage(p)">{{ p }}</button>
        </li>

        <li class="page-item" [class.disabled]="page === totalPages">
          <button class="page-link" type="button" (click)="nextPage()" aria-label="Next">»</button>
        </li>
      </ul>
    </nav>
  </div>
</section>
