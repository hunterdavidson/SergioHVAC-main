<section id="home" class="masthead" [ngStyle]="settings.value.home.heroUrl ? {'background-image': 'url(' + settings.value.home.heroUrl + ')', 'background-size': 'cover', 'background-position': 'center', 'box-shadow': 'inset 0 0 0 2000px rgba(0,0,0,0.6)'} : {}">
  <div class="container h-100">
    <div class="row h-100 align-items-center justify-content-center text-center">
      <div class="col-lg-10 align-self-end">
        <h1 class="masthead-heading text-white text-uppercase mb-4">
          {{ settings.value.home.headline || 'Need HVAC Service Today? We’re Just a Click Away' }}
        </h1>
      </div>
      <div class="col-lg-8 align-self-baseline">
        <h3 class="masthead-subheading text-white mb-5">
          {{ settings.value.home.subhead || 'Reliable, Fast, and Local — Book Your Appointment in Minutes' }}
        </h3>
        <a class="btn btn-primary btn-xl text-uppercase dynamic-button" routerLink="/" fragment="contact">
          {{ settings.value.home.ctaText || 'Schedule Your Free Quote' }}
        </a>
      </div>
    </div>
  </div>
</section>
