<section
  id="home"
  class="masthead"
  [ngStyle]="settings.value.home.heroUrl
    ? {'background-image': 'url(' + settings.value.home.heroUrl + ')', 'background-size': 'cover', 'background-position': 'center'}
    : {}"
>
  <div class="overlay" aria-hidden="true"></div>
  <div class="container h-100">
    <div class="row h-100 align-items-center justify-content-center text-center">
      <div class="col-lg-10 hero-inner">
        <h1 class="masthead-heading text-white text-uppercase mb-4">
          {{ settings.value.home.headline || 'Need HVAC Service Today? We’re Just a Click Away' }}
        </h1>

        <h3 class="masthead-subheading text-white mb-4">
          {{ settings.value.home.subhead || 'Reliable, Fast, and Local — Book Your Appointment in Minutes' }}
        </h3>

        <div class="hero-cta">
          <a
            class="btn btn-xl text-uppercase dynamic-button mt-3"
            routerLink="/"
            fragment="contact"
          >
            {{ settings.value.home.ctaText || 'Schedule Your Free Quote' }}
          </a>

          <a
            *ngIf="settings.value.navbar?.phone"
            class="btn btn-outline-light btn-xl text-uppercase btn-call"
            [href]="'tel:' + (settings.value.navbar?.phone || '')"
          >
            <i class="fa-solid fa-phone me-2"></i>
            {{ settings.value.navbar?.phone }}
          </a>
        </div>
      </div>
    </div>
  </div>
</section>
